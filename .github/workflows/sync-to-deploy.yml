# Sync feature branch → deploy branch.
#
# De github-pages environment laat alleen claude/biotech-signal-detector-3ajql
# deployen. GITHUB_TOKEN pushes triggeren geen nieuwe workflow, dus doen we
# twee dingen:
#  1. Force-push naar de deploy-branch zodat die branch up-to-date is.
#  2. Trigger pages.yml via workflow_dispatch op die branch — dat activeert
#     wél de echte deploy (workflow_dispatch omzeilt de loop-blokkering).

name: Sync to deploy branch

on:
  push:
    branches:
      - claude/poll-fundamentals-background-5TjhG
    # Docs-only pushes (kennisexport schrijft docs/kennisbasis.md + CLAUDE.md)
    # hoeven geen site-rebuild+deploy te triggeren — dat zijn pure verspilde
    # runs (en logs die de Actions-opslag opvullen). De gebouwde site bevat
    # geen markdown/docs, dus alleen code-wijzigingen hoeven te deployen.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to deploy branch
        run: |
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push origin HEAD:claude/biotech-signal-detector-3ajql --force

      - name: Trigger Pages deploy via workflow_dispatch
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"claude/biotech-signal-detector-3ajql"}')
          echo "workflow_dispatch HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "::warning::workflow_dispatch mislukt (HTTP $HTTP_STATUS) — controleer actions-permissies"
          fi
