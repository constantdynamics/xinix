# Build de React app en publiceer naar GitHub Pages.
# Site komt op: https://constantdynamics.github.io/xinix/
#
# Deploy-bron: alleen claude/biotech-signal-detector-3ajql (de branch die
# GitHub Pages environment-rechten heeft). Pushes naar de feature branch
# worden automatisch doorgezet via sync-to-deploy.yml.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/biotech-signal-detector-3ajql
  workflow_dispatch:
    inputs:
      sha:
        description: "Exacte commit-SHA om te bouwen (optioneel; leeg = branch-HEAD)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Bouw exact de meegegeven commit (via workflow_dispatch input) i.p.v. de
      # branch-HEAD. Voorkomt de race waarbij een net-geforcepushte deploy-branch
      # nog niet is gepropageerd en GitHub de vórige commit zou uitchecken.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          BUILD_TARGET: pages
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Add 404 fallback (Pages SPA routing)
        run: cp dist/index.html dist/404.html

      # Faalt deze stap met "Get Pages site failed ... Not Found", dan staat
      # GitHub Pages uit in de repo-instellingen en staat de site offline
      # terwijl de build gewoon slaagt. Fix: Settings -> Pages -> Source =
      # "GitHub Actions". Niet vanuit CI te repareren: `enablement: true`
      # geprobeerd op 2026-08-24 en dat geeft "Resource not accessible by
      # integration" — een Pages-site aanmaken vereist admin-rechten, en de
      # GITHUB_TOKEN heeft met `pages: write` alleen deploy-rechten.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
