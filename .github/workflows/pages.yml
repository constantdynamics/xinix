# Build de React app en publiceer naar GitHub Pages.
# Site komt op: https://constantdynamics.github.io/xinix/
#
# Deploy-bron: alleen claude/biotech-signal-detector-3ajql (de branch die
# GitHub Pages environment-rechten heeft). Pushes naar de feature branch
# worden automatisch doorgezet via sync-to-deploy.yml.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/biotech-signal-detector-3ajql
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          BUILD_TARGET: pages
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Add 404 fallback (Pages SPA routing)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
